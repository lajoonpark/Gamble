name: Deploy to GitHub Pages

# Publishing from `dev` rather than `main`: the site is developed there (and
# `main` is still only a README, so deploying it would publish an empty site).
# A project site is served from /<repo>/, so every asset path must stay
# relative — index.html, the import map, and vendor/ all already are.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do let a newer commit finish publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tools/ is the local test harness (puppeteer, screenshots) and has no
      # business on the published site. docs/ holds the README screenshots, which
      # GitHub renders from the repo rather than from the site — shipping them
      # would add ~4 MB to the artifact for images no page requests.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html favicon.svg src vendor _site/
          du -sh _site

      # Fail with the actual remedy rather than a confusing 404 from a later
      # step. Enabling Pages is a one-time repo-admin action; it cannot be done
      # from a workflow, and the REST call needs the `pages` scope, which most
      # personal tokens do not have.
      - name: Check Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "::error::GitHub Pages is not enabled for this repository."
            echo "::error::Fix once at: https://github.com/${{ github.repository }}/settings/pages"
            echo "::error::  -> Source: GitHub Actions, then re-run this workflow."
            exit 1
          fi
          echo "Pages is enabled"

      - name: Sanity-check the bundle
        run: |
          set -e
          test -f _site/index.html
          test -f _site/src/main.js
          test -d _site/vendor
          # A root-absolute asset path silently 404s under /<repo>/, which is the
          # one failure mode of a Pages project site. Fail the build instead.
          if grep -rnE '(href|src)="/|from "/|import\("/' _site/index.html _site/src; then
            echo "::error::root-absolute path found; project sites are served from a subpath"
            exit 1
          fi
          echo "paths are relative"

      # Note: no configure-pages step. Every asset path is relative, so the
      # action's `base_path`/`origin` outputs are not needed, and it cannot be
      # used to bootstrap the site: creating a Pages site needs repo *admin*,
      # and a workflow token can never hold admin. Pages has to be switched on
      # once in Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
