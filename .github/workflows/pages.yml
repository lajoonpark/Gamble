name: Deploy to GitHub Pages

# Publishes on every push to `dev` (`main` is still only a README).
#
# This writes a built site to the `gh-pages` branch rather than uploading a
# Pages artifact. That is deliberate: switching the repo to artifact deploys
# (build_type: workflow) needs repository admin, which a workflow token can
# never hold, so the branch mechanism is the one that works unattended. The
# trade-off is that Pages' legacy builder runs over the output, hence .nojekyll.
# To go branchless later, set Settings -> Pages -> Source: "GitHub Actions"
# once, then replace the deploy job with actions/upload-pages-artifact +
# actions/deploy-pages.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tools/ is the local test harness (puppeteer, screenshots) and has no
      # business on the published site. docs/ holds the README screenshots,
      # which GitHub renders from the repo rather than from the site, so
      # shipping them would just add ~4 MB no page ever requests.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html favicon.svg src vendor _site/
          touch _site/.nojekyll
          du -sh _site

      - name: Sanity-check the bundle
        run: |
          set -e
          test -f _site/index.html
          test -f _site/src/main.js
          test -d _site/vendor
          # A root-absolute asset path silently 404s under /Gamble/, which is
          # the one failure mode of a Pages project site. Fail the build
          # instead of publishing something broken.
          if grep -rnE '(href|src)="/|from "/|import\("/' _site/index.html _site/src; then
            echo "::error::root-absolute path found; project sites are served from a subpath"
            exit 1
          fi
          echo "paths are relative"

      # Force-push a single commit rather than accumulating deploy history: the
      # branch is pure output, and keeping every build would grow forever.
      - name: Publish to gh-pages
        working-directory: _site
        run: |
          set -e
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "published $(git rev-parse --short HEAD)"
